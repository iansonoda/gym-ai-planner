services:
  postgres:
    image: postgres:16-alpine
    container_name: gymai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymai
      POSTGRES_USER: gymai
      POSTGRES_PASSWORD: gymai
    ports:
      - "5432:5432"
    volumes:
      - gymai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymai -d gymai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gymai-postgres-data:
